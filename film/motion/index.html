<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RainReserve — original editorial film motion</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f7ef;color:#203d35}body{font-family:Arial,Helvetica,sans-serif}main{position:absolute;width:1600px;height:900px;transform-origin:0 0;background:#f7f7ef}.rule{position:absolute;left:90px;right:90px;top:85px;height:1px;background:#c8d3bf;transform-origin:left}.eyebrow,.number{position:absolute;top:112px;font-size:16px;letter-spacing:2.7px;font-weight:700}.eyebrow{left:90px}.number{right:90px;color:#526259}.title{position:absolute;left:90px;top:230px;margin:0;font-size:100px;font-weight:400;line-height:1.04;letter-spacing:-5px}.title em{font-family:Georgia,serif;font-weight:400;color:#607c35}.deck{position:absolute;left:95px;top:515px;font-size:28px;line-height:1.5;color:#526259;width:650px}.foot{position:absolute;left:95px;bottom:58px;font-size:20px;line-height:1.5;color:#526259}.art{position:absolute;right:70px;top:210px;width:640px;height:470px}.art svg{width:100%;height:100%;overflow:visible}.outline{fill:none;stroke:#547348;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.roof-lines{stroke-width:1.5;opacity:.6}.rain{stroke:#648b99;stroke-width:3;stroke-linecap:round}.flow{fill:none;stroke:#648b99;stroke-width:2;stroke-dasharray:4 9}.water{fill:#b5cf7c}.water-top{fill:none;stroke:#88a84c;stroke-width:2}.sprout{fill:#d9e897;stroke:#607c35;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.art-note{position:absolute;right:95px;top:710px;font-size:16px;letter-spacing:1.2px;color:#526259}.line-accent{position:absolute;left:95px;top:690px;width:390px;height:2px;background:#a94f26;transform-origin:left}.mini{font-size:16px;letter-spacing:2px;fill:#526259}.math-title{top:200px;font-size:67px;letter-spacing:-2px}.equation{position:absolute;left:95px;top:330px;width:1410px;display:flex;gap:24px;align-items:baseline}.term{font-size:63px;letter-spacing:-2px;white-space:nowrap}.operator{font-size:40px;color:#607c35}.answer{font-size:84px;color:#244d40}.definition{position:absolute;left:95px;top:285px;font-size:23px;color:#526259}.labels{position:absolute;left:95px;right:95px;top:455px;display:flex;gap:24px;border-top:1px solid #c8d3bf;padding-top:25px}.labels span{font-size:19px;color:#526259}.labels span:nth-child(1){width:196px}.labels span:nth-child(2){width:199px}.labels span:nth-child(3){width:162px}.labels span:nth-child(4){flex:1}.model-note{position:absolute;left:95px;top:560px;max-width:1180px;font-size:27px;line-height:1.55;color:#526259}.model-note b{font-weight:400;color:#203d35}.conservation{position:absolute;left:95px;top:683px;display:flex;align-items:center;gap:16px;font-size:22px;color:#526259}.pill{padding:12px 20px;background:#e9efdc;border:1px solid #d1ddbf;border-radius:40px}.end-title{top:230px;font-size:88px;line-height:1.18;letter-spacing:-3.5px}.brand{position:absolute;left:95px;top:515px;font-size:41px;letter-spacing:-1.7px}.brand span{color:#607c35;padding-left:12px}.url{position:absolute;left:95px;top:600px;font-size:29px;color:#244d40;border-bottom:1px solid #c8d3bf;padding-bottom:12px}.end-symbol{position:absolute;right:110px;top:525px;width:95px;height:95px;border-radius:50%;background:linear-gradient(to bottom,#e9efdc 50%,#b5cf7c 50%);border:2px solid #607c35}.end-foot{bottom:65px;font-size:23px}
</style></head><body><main id="stage"></main><script src="gsap.min.js"></script><script>
'use strict';
const scene=new URLSearchParams(location.search).get('scene')||'intro';
if(!['intro','math','end'].includes(scene))throw Error('Unknown film scene');
const stage=document.getElementById('stage');
const common='<div class="rule"></div><div class="eyebrow">RAINRESERVE / FIELD NOTES ON WATER</div>';
const drawing=`<div class="art"><svg viewBox="0 0 640 470" aria-label="Original illustrative roof, barrel and garden diagram, not live data"><defs><clipPath id="tank-mask"><rect x="290" y="195" width="142" height="203" rx="18"/></clipPath></defs><g class="rain"><path d="m74 65-12 25m48-18-12 25m48-32-12 25m48-18-12 25"/></g><g class="roof outline"><path d="m15 226 110-84 110 84M44 206v136h140V206"/><path class="roof-lines" d="M62 230h102m-102 24h102m-102 24h102m-102 24h102"/></g><path class="flow" d="M232 228H268V275H291"/><g clip-path="url(#tank-mask)"><rect class="water" x="290" y="265" width="142" height="135"/><path class="water-top" d="M290 265q35-10 71 0t71 0"/></g><rect class="outline tank" x="290" y="195" width="142" height="203" rx="18"/><path class="outline" d="M302 227h10m-10 38h10m-10 38h10m-10 38h10m-10 38h10"/><path class="flow" d="M432 355H468Q490 355 490 333V291H526"/><path class="sprout" d="M568 400V261m0 85c-44 0-52-33-47-43 35-1 47 21 47 43Zm0-37c40 0 52-30 46-39-33 0-46 20-46 39Z"/><path class="outline" d="M518 408h99"/><text class="mini" x="100" y="448" text-anchor="middle">COLLECT</text><text class="mini" x="361" y="448" text-anchor="middle">STORE</text><text class="mini" x="568" y="448" text-anchor="middle">USE</text></svg></div>`;
if(scene==='intro')stage.innerHTML=common+'<div class="number">01 / THE QUESTION</div><h1 class="title">Bigger barrel.<br><em>Better outcome?</em></h1><p class="deck">Rain does not arrive<br>when a garden needs it.</p><div class="line-accent"></div>'+drawing+'<div class="art-note">ORIGINAL ILLUSTRATION · NOT LIVE DATA</div><div class="foot">Explore the trade-off before making assumptions.</div>';
if(scene==='math')stage.innerHTML=common+'<div class="number">02 / FOLLOW EVERY LITRE</div><h1 class="title math-title">1 mm × 1 m² = 1 L</h1><div class="definition">Day 3 · Mixed month · synthetic rainfall</div><div class="equation"><span class="term">8 mm</span><span class="operator">×</span><span class="term">40 m²</span><span class="operator">×</span><span class="term">0.80</span><span class="operator">=</span><span class="term answer">256 L</span></div><div class="labels"><span>Rainfall depth</span><span>Connected roof area</span><span>Capture efficiency</span><span>Collected from roof</span></div><p class="model-note"><b>Collection comes first.</b> Water above capacity overflows.<br>Storage then supplies the remaining garden target.</p><div class="conservation"><span class="pill">Collect</span><span>→</span><span class="pill">Overflow</span><span>→</span><span class="pill">Use</span></div><div class="foot">Illustrative model arithmetic · Not measured water savings</div>';
if(scene==='end')stage.innerHTML=common+'<div class="number">MAKE THE ASSUMPTIONS VISIBLE</div><h1 class="title end-title">Less guesswork.<br><em>Every litre accounted for.</em></h1><div class="brand">RainReserve<span>◒</span></div><div class="url">sharonbasovich.github.io/rainreserve</div><div class="end-symbol"></div><div class="foot end-foot">Synthetic scenarios · Not measured savings</div>';
function fit(){stage.style.transform=`scale(${Math.min(innerWidth/1600,innerHeight/900)})`;}fit();addEventListener('resize',fit);
const duration={intro:12,math:15,end:9}[scene];
const tl=gsap.timeline({paused:true});
tl.from('.rule',{scaleX:0,duration:1.15,ease:'power2.out'},0).from('.eyebrow,.number',{opacity:0,duration:1},.15).from('.title',{y:24,opacity:0,duration:1.6,ease:'power2.out'},.35).from('.foot',{opacity:0,duration:1.2},1.3);
if(scene==='intro'){
 tl.from('.deck',{y:12,opacity:0,duration:1.4},1).from('.art',{y:15,opacity:0,duration:1.8},.35).from('.line-accent',{scaleX:0,duration:1.8,ease:'power2.inOut'},1.4).from('.art-note',{opacity:0,duration:1},1.5);
 tl.fromTo('.water,.water-top',{y:128},{y:0,duration:4.4,ease:'power1.inOut'},2.3).fromTo('.rain',{y:-18,opacity:0},{y:15,opacity:1,duration:1.1,repeat:3,yoyo:true,ease:'sine.inOut'},1.6).to('.flow',{strokeDashoffset:-78,duration:8,ease:'none'},2).from('.sprout',{scale:.85,transformOrigin:'50% 100%',duration:2,ease:'power2.out'},5.2);
}
if(scene==='math'){
 tl.from('.definition',{opacity:0,duration:1},1.1).from('.term:not(.answer)',{y:15,opacity:0,stagger:.5,duration:1.1},1.6).from('.operator',{opacity:0,stagger:.5,duration:.9},2).from('.answer',{y:14,opacity:0,duration:1.2},3.5).from('.labels',{opacity:0,y:8,duration:1.2},4).from('.model-note',{y:12,opacity:0,duration:1.4},5).from('.conservation>*',{opacity:0,y:8,stagger:.3,duration:.8},6.3);
}
if(scene==='end'){
 tl.from('.brand',{y:12,opacity:0,duration:1.2},1.3).from('.url',{opacity:0,y:12,duration:1.4},1.7).from('.end-symbol',{scale:.6,rotation:-90,opacity:0,duration:1.8,ease:'power2.out'},1.2).to('.end-symbol',{rotation:180,duration:4.5,ease:'sine.inOut'},3.2);
}
// Deliberate reading holds extend the timeline, not speech or app activity.
tl.to({}, {duration:.01},duration-.01);
window.film={duration,seek:t=>tl.seek(Math.max(0,Math.min(duration,t))),play:()=>tl.restart(),pause:()=>tl.pause()};window.__FILM_READY__=true;
</script></body></html>
